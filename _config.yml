# 伟er的储物袋 · Jekyll 配置
#
# 这份 = 线上 _config.yml 的完整内容 + 标了 ★ 的几行新增项，
# 键值没有删改任何一条，所以可以整份替换线上的同名文件。
#
# 站点基本信息
title: 伟er的储物袋
email: weihao1024@126.com
description: "于二进制世界中寻仙问道"
baseurl: ""
url: "https://wei-erer.github.io"
github_username: wei-erer
# twitter_username: jekyllrb
# 外观
avatar: "/assets/images/avatar.jpg"      # ★ 新增：首页头像（原来这行没有任何模板读它，所以从没显示过）
show_excerpts: true                      # ★ 新增：首页文章卡片显示摘要
tagline: "于二进制世界中寻仙问道"          # ★ 新增：首页站名下面那句话
# 顶部导航
header_pages:
  - about.markdown
# 构建
#
# 说明：minima 2.5 的配色走 Sass 变量（$brand-color 那一套），不读 CSS 变量，
# 所以想改配色请动 assets/main.scss 顶部的 :root，改那一处就全站生效。
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag                       # ★ 新增：社交分享卡片 / 搜索结果摘要
# 排除：下面三个目录只在本地有用（离线预览、皮肤原稿、自检脚本），
# 不需要上传，也不用让 Jekyll 处理。
exclude:
  - _reference
  - _tools
  - _preview
# 以下为 Jekyll 自带的排除项说明，保留备查。
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
